[project]
name = "palbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "motty", email = "motty.mio2@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "discord-py>=2.4.0",
    "docker>=7.1.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.4",
]

[project.scripts]
palbot = "palbot:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.14.1",
    "pytest>=8.3.5",
    "ruff>=0.17.0",
    "types-requests>=2.32.0.20241016",
]

